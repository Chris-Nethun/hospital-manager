spring.application.name=hospital-manager
spring.datasource.url=jdbc:h2:file:./hospitaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=change-me-very-long-secret-key-for-hospital-manager-1234567890
app.jwt.expiration-ms=86400000
server.port=8090
